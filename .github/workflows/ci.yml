# Continuous integration. Every job runs the same commands as local
# development; see README.md.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  checks:
    name: Lint, typecheck, unit tests, build, bundle checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Client bundles contain no server-only settings or secrets
        run: pnpm check:bundles
      - name: Built servers start
        run: pnpm check:servers

  integration:
    name: PostgreSQL, RLS, API, payments and jobs integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Local-only example credentials for the disposable CI services.
      - run: cp .env.example .env
      - name: Start PostgreSQL, Redis, object storage, mail sink and Dex
        run: pnpm infra:up
      - run: pnpm test:integration
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file .env logs --no-color --tail 200

  experience:
    name: Accessibility audit and performance budgets (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: cp .env.example .env
      - run: pnpm infra:up
      - run: pnpm db:setup && pnpm db:seed
      - run: pnpm build
      - name: Start the API, worker, admin and storefront
        run: |
          for app in api worker admin storefront; do
            nohup pnpm --filter "@workeasy/$app" start > "$RUNNER_TEMP/$app.log" 2>&1 &
          done
          npx --yes wait-on@8.0.3 --timeout 180000 http://localhost:4000/health/ready http://localhost:3000/healthz http://localhost:3001/healthz http://localhost:3001/s/demo
      - name: Performance budgets
        run: pnpm check:budgets --store demo
      - name: Accessibility audit (axe, keyboard, phone widths, dark mode)
        run: pnpm check:a11y --out "$RUNNER_TEMP/a11y"
      - name: Audit screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-report
          path: ${{ runner.temp }}/a11y
          retention-days: 14
      - name: Server logs on failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/*.log

  audit:
    name: Dependency audit (production, high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
